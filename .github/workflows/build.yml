name: Écho : build, tests et essai sur émulateur

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Tests du jeu
        run: gradle testDebugUnitTest --no-daemon

      - name: Compiler l'APK
        run: gradle assembleDebug --no-daemon

      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Essai sur téléphone virtuel
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash ci/smoke.sh

      - name: Rapport des tests
        if: always()
        run: |
          mkdir -p out
          cp -r app/build/reports/tests/testDebugUnitTest out/tests 2>/dev/null || true
          cp app/build/test-results/testDebugUnitTest/*.xml out/ 2>/dev/null || true

      - name: Publier APK + captures sur la branche apk
        if: always()
        run: |
          mkdir -p pub
          cp app/build/outputs/apk/debug/app-debug.apk pub/Echo.apk 2>/dev/null || true
          cp -r out pub/ 2>/dev/null || true
          cd pub
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q --allow-empty -m "Build ${GITHUB_SHA::7} (${{ job.status }})"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
